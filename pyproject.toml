[project]
name = "graph-mcp"
version = "0.1.0"
description = "Retrieval-backed MCP server for the Microsoft Graph API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.scripts]
graph-mcp = "graph_mcp.server:main"

[project.optional-dependencies]
# Local embeddings for reproducible builds and CI. Production can swap in
# Azure OpenAI via GRAPH_MCP_EMBEDDER=azure (see src/graph_mcp/retrieval/embedders.py).
local-embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
